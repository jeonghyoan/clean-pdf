<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>깔끔한 PDF 뷰어</title>
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link id="appManifest" rel="manifest" href="./manifest.json" />
  <link id="appleTouchIcon" rel="apple-touch-icon" href="./icon-192.png" />
  <script src="./pdf.min.js"></script>
  <script>
    // 배포판: 같은 폴더의 워커 파일을 써서 PDF 파싱을 별도 스레드에서 처리
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.js';
    }
  </script>
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --text: #18181b;
      --muted: #71717a;
      --border: #e4e4e7;
      --accent: #2563eb;
      --accent-text: #ffffff;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.08);
    }
    body.dark {
      --bg: #0f1115;
      --surface: #181b20;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --border: #27272a;
      --accent: #3b82f6;
      --accent-text: #ffffff;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 30;
      height: 54px; padding: 0 10px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      box-shadow: var(--shadow);
    }
    .group { display: flex; align-items: center; gap: 5px; min-width: 0; }
    .btn {
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      border-radius: 10px; padding: 7px 10px; font-size: 13px; font-weight: 600;
      cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px;
    }
    .btn.primary {
      background: var(--accent); color: var(--accent-text); border-color: var(--accent);
    }
    .btn:active { opacity: 0.75; }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .filename {
      font-size: 13px; font-weight: 600; color: var(--muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 105px;
    }
    .searchbar {
      position: fixed; top: 54px; left: 0; right: 0; z-index: 25;
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 8px 10px; display: none; align-items: center; gap: 6px;
      box-shadow: var(--shadow);
    }
    .searchbar.show { display: flex; }
    .search-input {
      flex: 1; min-width: 0; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); border-radius: 10px;
      padding: 7px 10px; font-size: 14px; outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-count {
      font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap;
      min-width: 46px; text-align: center;
    }
    .viewer-wrap {
      padding: 64px 8px 80px;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      transition: padding-top 0.15s ease;
    }
    body.search-open .viewer-wrap { padding-top: 112px; }
    .empty-state {
      margin: auto; text-align: center; padding: 36px 24px;
      max-width: 340px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; box-shadow: var(--shadow);
    }
    .empty-state h1 { font-size: 18px; margin: 0 0 8px; }
    .empty-state p { font-size: 13px; color: var(--muted); margin: 0 0 20px; line-height: 1.5; }
    .page-card {
      background: #ffffff;
      box-shadow: var(--shadow);
      border-radius: 4px;
      overflow: hidden;
      display: flex; justify-content: center; align-items: center;
      position: relative;
    }
    .page-card canvas { display: block; max-width: 100%; height: auto !important; }
    .highlight-layer {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; overflow: hidden;
    }
    .hl-box {
      position: absolute;
      background: rgba(250, 204, 21, 0.45);
      border-radius: 2px;
    }
    .hl-box.active {
      background: rgba(249, 115, 22, 0.55);
      outline: 2px solid #ea580c;
    }
    .page-badge {
      position: absolute; bottom: 8px; right: 8px;
      background: rgba(0,0,0,0.55); color: #fff;
      font-size: 11px; padding: 2px 7px; border-radius: 999px;
      pointer-events: none;
    }
    .bottombar {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      z-index: 20; background: var(--surface); border: 1px solid var(--border);
      border-radius: 999px; padding: 6px 12px; box-shadow: var(--shadow);
      display: none; align-items: center; gap: 8px;
    }
    .bottombar.show { display: flex; }
    .page-input {
      width: 44px; text-align: center; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); border-radius: 8px;
      padding: 4px; font-size: 13px; font-weight: 600;
    }
    .total-pages { font-size: 13px; color: var(--muted); font-weight: 600; }
    #fileInput { display: none; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="group">
      <button class="btn primary" id="openBtn">📂 열기</button>
      <span class="filename" id="fileName">파일 없음</span>
    </div>
    <div class="group">
      <button class="btn" id="searchToggleBtn" disabled title="검색">🔍</button>
      <button class="btn" id="zoomOutBtn" disabled>-</button>
      <button class="btn" id="zoomResetBtn" disabled>100%</button>
      <button class="btn" id="zoomInBtn" disabled>+</button>
      <button class="btn" id="installBtn" style="display:none;" title="앱으로 설치">⬇</button>
      <button class="btn" id="themeBtn" title="다크모드">🌙</button>
    </div>
  </header>

  <div class="searchbar" id="searchBar">
    <input type="search" class="search-input" id="searchInput" placeholder="PDF 안의 단어 검색..." />
    <span class="search-count" id="searchCount">0 / 0</span>
    <button class="btn" id="searchPrevBtn" disabled>▲</button>
    <button class="btn" id="searchNextBtn" disabled>▼</button>
    <button class="btn" id="searchCloseBtn">✕</button>
  </div>

  <main class="viewer-wrap" id="viewer">
    <div class="empty-state" id="emptyState">
      <h1>광고 없는 PDF 뷰어</h1>
      <p>폰에 있는 PDF 파일을 고르면 바로 열려요.<br/>‘내 파일’ 앱에서 이 앱으로 공유해도 열립니다.<br/>서버 전송 없이 기기 안에서만 읽습니다.</p>
      <button class="btn primary" id="emptyOpenBtn" style="padding: 12px 20px; font-size: 15px;">PDF 파일 선택하기</button>
    </div>
  </main>

  <footer class="bottombar" id="bottomBar">
    <button class="btn" id="prevBtn" style="padding: 5px 10px;">◀</button>
    <input type="number" class="page-input" id="pageInput" min="1" value="1" />
    <span class="total-pages" id="totalPages">/ 0</span>
    <button class="btn" id="nextBtn" style="padding: 5px 10px;">▶</button>
  </footer>

  <input type="file" id="fileInput" accept="application/pdf,.pdf,android/genericfile" />

  <script>
    const fileInput = document.getElementById('fileInput');
    const openBtn = document.getElementById('openBtn');
    const emptyOpenBtn = document.getElementById('emptyOpenBtn');
    const fileNameEl = document.getElementById('fileName');
    const viewer = document.getElementById('viewer');
    const bottomBar = document.getElementById('bottomBar');
    const pageInput = document.getElementById('pageInput');
    const totalPagesEl = document.getElementById('totalPages');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const zoomResetBtn = document.getElementById('zoomResetBtn');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const themeBtn = document.getElementById('themeBtn');

    const searchToggleBtn = document.getElementById('searchToggleBtn');
    const searchBar = document.getElementById('searchBar');
    const searchInput = document.getElementById('searchInput');
    const searchCount = document.getElementById('searchCount');
    const searchPrevBtn = document.getElementById('searchPrevBtn');
    const searchNextBtn = document.getElementById('searchNextBtn');
    const searchCloseBtn = document.getElementById('searchCloseBtn');

    let pdfDoc = null;
    let zoomFactor = 1.0;
    let pageCards = [];
    let renderedPages = new Set();
    let observer = null;
    let currentFileKey = '';

    // Search state
    let pageTextCache = new Map(); // pageNum -> items[]
    let searchMatches = []; // { pageNum, itemIndex }
    let activeMatchIdx = -1;
    let currentQuery = '';

    // Theme
    if (localStorage.getItem('pdf_viewer_dark') === '1') {
      document.body.classList.add('dark');
      themeBtn.textContent = '☀️';
    }
    themeBtn.addEventListener('click', () => {
      const isDark = document.body.classList.toggle('dark');
      themeBtn.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('pdf_viewer_dark', isDark ? '1' : '0');
    });

    openBtn.addEventListener('click', () => fileInput.click());
    emptyOpenBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') {
        alert('PDF 파일만 열 수 있어요. 선택한 파일: ' + file.name);
        e.target.value = '';
        return;
      }
      await loadPdfFile(file);
    });

    async function loadPdfFile(file) {
      if (typeof pdfjsLib === 'undefined') {
        alert('PDF 엔진을 불러오지 못했어요. 인터넷 연결을 확인한 뒤 새로고침해 주세요.');
        return;
      }
      fileNameEl.textContent = file.name;
      currentFileKey = `pdf_pos_${file.name}_${file.size}`;
      pageTextCache.clear();
      clearSearch();
      viewer.innerHTML = '<div class="empty-state"><p style="margin:0;">불러오는 중...</p></div>';

      try {
        const buf = await file.arrayBuffer();
        pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
        zoomFactor = 1.0;
        updateZoomLabel();
        enableControls(true);
        await buildPagePlaceholders();

        const savedPage = parseInt(localStorage.getItem(currentFileKey) || '1', 10);
        if (savedPage > 1 && savedPage <= pdfDoc.numPages) {
          jumpToPage(savedPage);
        }
      } catch (err) {
        console.error(err);
        viewer.innerHTML = '<div class="empty-state"><h1>열기 실패</h1><p>손상되었거나 암호가 걸린 PDF일 수 있어요.</p><button class="btn primary" onclick="document.getElementById(\'fileInput\').click()">다른 파일 고르기</button></div>';
      }
    }

    function enableControls(on) {
      searchToggleBtn.disabled = !on;
      zoomOutBtn.disabled = !on;
      zoomResetBtn.disabled = !on;
      zoomInBtn.disabled = !on;
      bottomBar.classList.toggle('show', on);
    }

    function updateZoomLabel() {
      zoomResetBtn.textContent = `${Math.round(zoomFactor * 100)}%`;
    }

    async function buildPagePlaceholders() {
      viewer.innerHTML = '';
      pageCards = [];
      renderedPages.clear();
      if (observer) observer.disconnect();

      totalPagesEl.textContent = `/ ${pdfDoc.numPages}`;
      pageInput.max = pdfDoc.numPages;
      pageInput.value = 1;

      const firstPage = await pdfDoc.getPage(1);
      const baseViewport = firstPage.getViewport({ scale: 1 });
      const maxWidth = Math.min(window.innerWidth - 16, 900);
      const fitScale = (maxWidth / baseViewport.width) * zoomFactor;

      for (let num = 1; num <= pdfDoc.numPages; num++) {
        const card = document.createElement('div');
        card.className = 'page-card';
        card.dataset.page = num;
        card.style.width = `${Math.floor(baseViewport.width * fitScale)}px`;
        card.style.minHeight = `${Math.floor(baseViewport.height * fitScale)}px`;

        const badge = document.createElement('span');
        badge.className = 'page-badge';
        badge.textContent = `${num} / ${pdfDoc.numPages}`;
        card.appendChild(badge);

        viewer.appendChild(card);
        pageCards.push(card);
      }

      observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          const num = parseInt(entry.target.dataset.page, 10);
          if (entry.isIntersecting) {
            renderPage(num, entry.target);
            if (entry.intersectionRatio >= 0.4) {
              pageInput.value = num;
              if (currentFileKey) localStorage.setItem(currentFileKey, String(num));
            }
          }
        });
      }, { rootMargin: '300px 0px', threshold: [0.01, 0.4] });

      pageCards.forEach((c) => observer.observe(c));
    }

    async function renderPage(num, card) {
      if (renderedPages.has(num)) return;
      renderedPages.add(num);

      const page = await pdfDoc.getPage(num);
      const unscaled = page.getViewport({ scale: 1 });
      const maxWidth = Math.min(window.innerWidth - 16, 900);
      const scale = (maxWidth / unscaled.width) * zoomFactor;
      const viewport = page.getViewport({ scale });

      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = Math.floor(viewport.width * dpr);
      canvas.height = Math.floor(viewport.height * dpr);
      canvas.style.width = `${Math.floor(viewport.width)}px`;
      canvas.style.height = `${Math.floor(viewport.height)}px`;

      card.style.width = `${Math.floor(viewport.width)}px`;
      card.style.minHeight = `${Math.floor(viewport.height)}px`;

      const hlLayer = document.createElement('div');
      hlLayer.className = 'highlight-layer';

      const badge = card.querySelector('.page-badge');
      card.innerHTML = '';
      card.appendChild(canvas);
      card.appendChild(hlLayer);
      if (badge) card.appendChild(badge);

      await page.render({
        canvasContext: ctx,
        viewport,
        transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null
      }).promise;

      if (currentQuery) {
        await drawHighlightsForPage(num, card, viewport);
      }
    }

    async function getPageTextItems(num) {
      if (pageTextCache.has(num)) return pageTextCache.get(num);
      const page = await pdfDoc.getPage(num);
      const content = await page.getTextContent();
      pageTextCache.set(num, content.items);
      return content.items;
    }

    async function drawHighlightsForPage(num, card, viewport) {
      const hlLayer = card.querySelector('.highlight-layer');
      if (!hlLayer) return;
      hlLayer.innerHTML = '';
      if (!currentQuery) return;

      const items = await getPageTextItems(num);
      const q = currentQuery.toLowerCase();
      const activeMatch = activeMatchIdx >= 0 ? searchMatches[activeMatchIdx] : null;

      items.forEach((item, idx) => {
        if (!item.str || !item.str.toLowerCase().includes(q)) return;
        const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
        const fontHeight = Math.max(Math.hypot(tx[2], tx[3]), 10);
        const width = Math.max(item.width * viewport.scale, 12);
        const box = document.createElement('div');
        box.className = 'hl-box';
        if (activeMatch && activeMatch.pageNum === num && activeMatch.itemIndex === idx) {
          box.classList.add('active');
        }
        box.style.left = `${tx[4]}px`;
        box.style.top = `${tx[5] - fontHeight}px`;
        box.style.width = `${width}px`;
        box.style.height = `${fontHeight * 1.2}px`;
        hlLayer.appendChild(box);
      });
    }

    async function refreshVisibleHighlights() {
      if (!pdfDoc) return;
      for (const num of renderedPages) {
        const card = pageCards[num - 1];
        if (!card) continue;
        const page = await pdfDoc.getPage(num);
        const unscaled = page.getViewport({ scale: 1 });
        const maxWidth = Math.min(window.innerWidth - 16, 900);
        const scale = (maxWidth / unscaled.width) * zoomFactor;
        const viewport = page.getViewport({ scale });
        await drawHighlightsForPage(num, card, viewport);
      }
    }

    function clearSearch() {
      searchMatches = [];
      activeMatchIdx = -1;
      currentQuery = '';
      searchCount.textContent = '0 / 0';
      searchPrevBtn.disabled = true;
      searchNextBtn.disabled = true;
      document.querySelectorAll('.highlight-layer').forEach((el) => (el.innerHTML = ''));
    }

    let searchTimer = null;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => runSearch(searchInput.value.trim()), 250);
    });
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (currentQuery === searchInput.value.trim() && searchMatches.length > 0) {
          moveMatch(1);
        } else {
          runSearch(searchInput.value.trim());
        }
      }
    });

    async function runSearch(query) {
      if (!pdfDoc || !query) {
        clearSearch();
        return;
      }
      currentQuery = query;
      searchMatches = [];
      activeMatchIdx = -1;
      const q = query.toLowerCase();

      for (let num = 1; num <= pdfDoc.numPages; num++) {
        searchCount.textContent = `${num}/${pdfDoc.numPages}`;
        const items = await getPageTextItems(num);
        items.forEach((item, idx) => {
          if (item.str && item.str.toLowerCase().includes(q)) {
            searchMatches.push({ pageNum: num, itemIndex: idx });
          }
        });
      }

      if (searchMatches.length === 0) {
        searchCount.textContent = '0 / 0';
        searchPrevBtn.disabled = true;
        searchNextBtn.disabled = true;
        await refreshVisibleHighlights();
        return;
      }

      searchPrevBtn.disabled = false;
      searchNextBtn.disabled = false;
      activeMatchIdx = 0;
      await focusActiveMatch();
    }

    async function focusActiveMatch() {
      if (activeMatchIdx < 0 || activeMatchIdx >= searchMatches.length) return;
      const m = searchMatches[activeMatchIdx];
      searchCount.textContent = `${activeMatchIdx + 1} / ${searchMatches.length}`;
      jumpToPage(m.pageNum);
      await refreshVisibleHighlights();
    }

    function moveMatch(delta) {
      if (searchMatches.length === 0) return;
      activeMatchIdx = (activeMatchIdx + delta + searchMatches.length) % searchMatches.length;
      focusActiveMatch();
    }

    searchPrevBtn.addEventListener('click', () => moveMatch(-1));
    searchNextBtn.addEventListener('click', () => moveMatch(1));

    searchToggleBtn.addEventListener('click', () => {
      const open = searchBar.classList.toggle('show');
      document.body.classList.toggle('search-open', open);
      if (open) {
        searchInput.focus();
      } else {
        clearSearch();
        searchInput.value = '';
      }
    });

    searchCloseBtn.addEventListener('click', () => {
      searchBar.classList.remove('show');
      document.body.classList.remove('search-open');
      clearSearch();
      searchInput.value = '';
    });

    function jumpToPage(num) {
      const target = Math.max(1, Math.min(pdfDoc ? pdfDoc.numPages : 1, num));
      const card = pageCards[target - 1];
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        pageInput.value = target;
      }
    }

    prevBtn.addEventListener('click', () => jumpToPage(parseInt(pageInput.value || '1', 10) - 1));
    nextBtn.addEventListener('click', () => jumpToPage(parseInt(pageInput.value || '1', 10) + 1));
    pageInput.addEventListener('change', () => jumpToPage(parseInt(pageInput.value || '1', 10)));

    zoomInBtn.addEventListener('click', () => {
      if (!pdfDoc) return;
      zoomFactor = Math.min(2.5, +(zoomFactor + 0.2).toFixed(1));
      updateZoomLabel();
      buildPagePlaceholders();
    });
    zoomOutBtn.addEventListener('click', () => {
      if (!pdfDoc) return;
      zoomFactor = Math.max(0.6, +(zoomFactor - 0.2).toFixed(1));
      updateZoomLabel();
      buildPagePlaceholders();
    });
    zoomResetBtn.addEventListener('click', () => {
      if (!pdfDoc) return;
      zoomFactor = 1.0;
      updateZoomLabel();
      buildPagePlaceholders();
    });
  </script>

    (function setupPWA() {

      const scopeUrl = baseUrl.replace(/[^/]*$/, '');

          const touch = APP_ICONS.find((i) => i.sizes === '512x512') || APP_ICONS[0];

      installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) {
          alert('브라우저 메뉴에서 "앱 설치" 또는 "홈 화면에 추가"를 눌러 줘!');
          return;
        }
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBtn.style.display = 'none';
      });
      window.addEventListener('appinstalled', () => {
        installBtn.style.display = 'none';
      });

      // 다른 앱(내 파일 등)에서 PDF를 공유해 들어온 경우 바로 열기
      (async () => {
        try {
          if (!new URLSearchParams(location.search).has('shared')) return;
          if (!('caches' in window)) return;
          const key = new URL('./shared-file', location.href).href;
          const cache = await caches.open('pdf-viewer-share');
          const res = await cache.match(key);
          if (!res) return;
          await cache.delete(key);
          const blob = await res.blob();
          let name = 'shared.pdf';
          try {
            name = decodeURIComponent(res.headers.get('x-filename') || '') || name;
          } catch (e) {}
          history.replaceState(null, '', location.pathname);
          await loadPdfFile(new File([blob], name, { type: 'application/pdf' }));
        } catch (e) {
          console.warn('공유 파일 열기 실패', e);
        }
      })();
    })();
  </script>
</body>
</html>
